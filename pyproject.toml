[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gamefinder"
version = "0.1.0"
description = "Discord bot for TTRPG game scheduling intelligence"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.4.0",
    "aiosqlite>=0.20.0",
    "APScheduler>=3.10.0",
    "icalendar>=6.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mcp-discord>=0.1.0",
    "mcp>=1.0.0,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ASYNC"]

[tool.setuptools.packages.find]
include = ["bot*"]
