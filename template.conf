# Which optional template subsystems this repository uses.
#
# Format: shell `key=value`, sourced by scripts/lib/subsystems.sh. Values are
# `true` or `false`.

# Local-model delegation — OFF. This project always uses Claude.
SUBSYSTEM_ROUTING=false

# GitHub Project board workflow — ON. Portfolio project, tracked publicly.
SUBSYSTEM_BOARD=true

# BMAD planning — OFF. Using superpowers skills instead.
SUBSYSTEM_BMAD=false

# Caveman response-style plugin — ON.
SUBSYSTEM_CAVEMAN=true

# Day-0 provisioning — ON until bootstrap complete.
SUBSYSTEM_DAY0=true
